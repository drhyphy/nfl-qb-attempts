name: Capture same-event near-kickoff prices
on:
  schedule:
    # Small read-only gate; odds are fetched only when a kickoff is within one hour.
    # Includes Wednesday 2026 opener, international morning games, and Saturdays.
    - cron: '7,27,47 0-5,12-23 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: qb-attempts-publish
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Capture eligible events
        run: python scripts/capture_close.py
      - name: Preserve observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -d data/published/closing ]; then
            git add data/published/closing
            if ! git diff --cached --quiet; then
              git commit -m "Archive exact-event near-kickoff quotes"
              git push
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: closing-source-evidence-${{ github.run_id }}
          path: data/raw/closing
          if-no-files-found: ignore
          retention-days: 90
