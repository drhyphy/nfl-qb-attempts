name: Daily 6-30 Eastern board
on:
  schedule:
    - cron: '30 10 * * *'
    - cron: '30 11 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: qb-attempts-publish
  cancel-in-progress: false
jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Eastern daylight-saving gate
        id: clock
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          offset=datetime.now(ZoneInfo('America/New_York')).utcoffset().total_seconds()
          expected='30 10 * * *' if offset==-14400 else '30 11 * * *'
          accepted=os.environ['EVENT']!='schedule' or os.environ['CRON']==expected
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f'run={str(accepted).lower()}\n')
          PY
      - uses: actions/setup-python@v5
        if: steps.clock.outputs.run == 'true'
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/cache@v4
        if: steps.clock.outputs.run == 'true'
        with:
          path: |
            data/raw/*.parquet
            data/pbp_cache/team_games_*.parquet
            data/pbp_cache/team_games_*.json
          key: qb-history-v2-${{ github.run_id }}
          restore-keys: |
            qb-history-v2-
            qb-history-v1-
      - name: Install and test
        if: steps.clock.outputs.run == 'true'
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q
      - name: Refresh data, validate, and evaluate current odds
        if: steps.clock.outputs.run == 'true'
        id: scoring
        continue-on-error: true
        run: python scripts/run_daily.py --refresh-data --train
      - name: Preserve daily decisions and source status
        if: steps.clock.outputs.run == 'true' && always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/published data/tendencies data/model site/public/board.json
          if ! git diff --cached --quiet; then
            git commit -m "Record immutable NFL board $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: steps.clock.outputs.run == 'true' && always()
        with:
          name: daily-model-and-source-evidence-${{ github.run_id }}
          path: |
            data/raw/manifest.json
            data/raw/odds
            data/raw/context
            data/raw/game_markets
            data/tendencies
            data/model
            data/published/latest.json
          retention-days: 90
      - uses: actions/setup-node@v4
        if: steps.clock.outputs.run == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build dashboard
        if: steps.clock.outputs.run == 'true'
        env:
          GITHUB_PAGES: '1'
        working-directory: site
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v5
        if: steps.clock.outputs.run == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.clock.outputs.run == 'true'
        with:
          path: site/dist/client
      - uses: actions/deploy-pages@v4
        if: steps.clock.outputs.run == 'true'
        id: deployment
      - name: Signal collection failure after publishing explicit no-bet status
        if: steps.clock.outputs.run == 'true' && steps.scoring.outcome == 'failure'
        run: exit 1
